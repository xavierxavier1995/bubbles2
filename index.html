<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubbles Pet Cosmetics</title>
    
    <!-- Preconnect & DNS Prefetch para domínios externos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://bubbles.gabrielxavier.online" crossorigin>
    <link rel="dns-prefetch" href="https://bubbles.gabrielxavier.online">
    
    <!-- Preload dos Assets LCP (Largest Contentful Paint) da Primeira Dobra -->
    <link rel="preload" as="image" href="https://bubbles.gabrielxavier.online/bubbles-linha-pro-desktop.webp" media="(min-width: 769px)" fetchpriority="high">
    <link rel="preload" as="image" href="https://bubbles.gabrielxavier.online/bubbles-linha-pro-mobile.webp" media="(max-width: 768px)" fetchpriority="high">
    <link rel="preload" as="image" href="https://bubbles.gabrielxavier.online/BUBBLES.svg" fetchpriority="high">

    <!-- CSS Crítico (Inlined) para a Primeira Dobra -->
    <style>
      /* Reseta e define o fundo escuro imediatamente para evitar "Flash of White Screen" */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #080808;
        color: #ffffff;
        font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Oculta o loader inicial assim que o React montar (o React substitui o conteúdo do #root) */
      .critical-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #080808;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loader Crítico exibido enquanto o JS/CSS principal é baixado -->
      <div class="critical-loader">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#F4CDD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Tag Manager (Lazy Load on First Interaction) -->
    <script>
      (function() {
        var gtmId = 'GTM-N4PHK6DM';
        var gtmLoaded = false;

        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;

          // Remove listeners
          var events = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
          events.forEach(function(event) {
            window.removeEventListener(event, loadGTM);
          });

          // Inject GTM Script
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer',gtmId);
        }

        // Add listeners
        var events = ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'];
        events.forEach(function(event) {
          window.addEventListener(event, loadGTM, { passive: true, once: true });
        });
      })();
    </script>
  </body>
</html>
